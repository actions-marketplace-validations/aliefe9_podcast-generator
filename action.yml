name: "Podcast Generator"
author: "Ali Efe Isik"
description: "Generates a podcast feed from a YAML file."
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "podcast"
  color: "green"
inputs:
  email:
    description: "The committer's email address"
    required: true
    default: "${{ github.actor }}@localhost"
  name:
    description: "The committer's name"
    required: true
    default: "${{ github.actor }}"
